{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1 class="app-title">Smart Closet</h1>
    <p class="app-subtitle">Your Personal AI Stylist</p>

    <div class="tabs-container">
        <input type="radio" name="tabs" id="tab1" checked>
        <input type="radio" name="tabs" id="tab2">
        <input type="radio" name="tabs" id="tab3">
        
        <div class="tab-labels">
            <label for="tab1" class="tab-btn">Log In</label>
            <label for="tab2" class="tab-btn">Sign Up</label>
            <label for="tab3" class="tab-btn">Reset</label>
        </div>

        <div class="tab-content" id="content1">
            <form action="/" method="POST">
                <div class="input-group">
                    <label>Email or Username</label>
                    <input type="text" name="login_input" required placeholder="Enter your email">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Log In</button>
            </form>
        </div>

        <div class="tab-content" id="content2">
            <form action="/signup" method="POST">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" name="username" required placeholder="Pick a username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn">Create Account</button>
            </form>
        </div>

        <div class="tab-content" id="content3">
            <form action="/reset" method="POST">
                <div class="input-group">
                    <label>Registered Email</label>
                    <input type="email" name="reset_email" required placeholder="you@example.com">
                </div>
                <button type="submit" class="btn" name="action" value="send_code">Send Code</button>
                
                <hr style="margin: 20px 0; border-color: var(--border);">
                
                <div class="input-group">
                    <label>6-Digit Code</label>
                    <input type="text" name="reset_code" placeholder="123456">
                </div>
                <div class="input-group">
                    <label>New Password</label>
                    <input type="password" name="new_password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn" name="action" value="reset_password">Reset Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
